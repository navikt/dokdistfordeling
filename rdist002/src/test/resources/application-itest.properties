spring.main.allow-bean-definition-overriding=true
spring.http.codecs.max-in-memory-size=10MB
spring.jackson.deserialization.fail-on-null-for-primitives=false
spring.jackson.mapper.accept-case-insensitive-properties=true

# circuitbreaker
resilience4j.circuitbreaker.configs.default.record-exceptions=no.nav.dokdistfordeling.exception.technical.AbstractDokdistfordelingTechnicalException
resilience4j.circuitbreaker.configs.default.ignore-exceptions=no.nav.dokdistfordeling.exception.functional.AbstractDokdistfordelingFunctionalException
resilience4j.circuitbreaker.configs.default.sliding-window-size=4
resilience4j.circuitbreaker.instances.dokdistadmin.base-config=default
resilience4j.circuitbreaker.instances.dokdistkanal.base-config=default
resilience4j.circuitbreaker.instances.dokarkiv.base-config=default
resilience4j.circuitbreaker.instances.dokmet.base-config=default
resilience4j.circuitbreaker.instances.pdl.base-config=default
resilience4j.circuitbreaker.instances.regoppslag.base-config=default
resilience4j.circuitbreaker.instances.safgraphql.base-config=default
resilience4j.circuitbreaker.instances.safhentdokument.base-config=default

# retry
resilience4j.retry.configs.default.retry-exceptions=no.nav.dokdistfordeling.exception.technical.AbstractDokdistfordelingTechnicalException
resilience4j.retry.configs.default.ignore-exceptions=no.nav.dokdistfordeling.exception.functional.AbstractDokdistfordelingFunctionalException,\
  no.nav.dokdistfordeling.exception.functional.DokdistkanalMappingException
resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.instances.dokdistadmin.base-config=default
resilience4j.retry.instances.dokdistkanal.base-config=default
resilience4j.retry.instances.dokarkiv.base-config=default
resilience4j.retry.instances.dokmet.base-config=default
resilience4j.retry.instances.pdl.base-config=default
resilience4j.retry.instances.regoppslag.base-config=default
resilience4j.retry.instances.safgraphql.base-config=default
resilience4j.retry.instances.safhentdokument.base-config=default


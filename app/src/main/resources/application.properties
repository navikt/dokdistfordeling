logging.config=classpath:logback-spring.xml
spring.main.banner_mode=off
# server
server.shutdown=graceful
server.tomcat.threads.min-spare=10
server.tomcat.threads.max=200
server.error.include-message=always
# actuators
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.endpoints.web.exposure.include=prometheus
management.metrics.enable.http.client.requests=false
# camel
camel.springboot.use-mdc-logging=true
camel.springboot.jmx-enabled=false

arkiverdokumentproduksjon.v1.endpointurl=http://dokarkiv/services/arkiverdokumentproduksjon/v1
arkiverdokumentproduksjon.v1.readtimeoutms=15000
arkiverdokumentproduksjon.v1.connecttimeoutms=3000
bestemDistribusjonKanal_url=http://dokdistkanal/rest/bestemKanal
hentdokument.url=http://saf/rest/hentdokument
storage_s3_url=http://objectstore.rook-ceph

srvappserver.username=srvappserver
srvappserver.password=
saf.graphql.url=http://saf/graphql
team: teamdokumenthandtering
image: "repo.adeo.no:5443/dok/dokdistfordeling"
replicas:
  min: 2
  max: 10
  cpuThresholdPercentage: 50
port: 8080
healthcheck:
  liveness:
    path: /isAlive
    initialDelay: 30
    failureThreshold: 10
  readiness:
    path: /isReady
    initialDelay: 30
    timeout: 3
prometheus:
  enabled: true
  path: /actuator/prometheus
resources:
  limits:
    cpu: 3000m
    memory: 1536Mi
  requests:
    memory: 1024Mi
fasitResources:
  used:
  - alias: srvdokdistfordeling
    resourceType: credential
    propertyMap:
      username: serviceuser_username
      password: serviceuser_password
  - alias: dokdistfordeling_s3_creds
    resourceType: credential
  - alias: dokdistmellomlager_s3_storage_crypto
    resourceType: credential
  - alias: hentdokumenter_fra_joark_crypto
    resourceType: credential
  - alias: DokumenttypeInfo_v4
    resourceType: restservice
  - alias: administrerforsendelse_v1
    resourceType: restservice
  - alias: "aktoerregister.api.v1"
    resourceType: restservice
  - alias: securityTokenService
    resourceType: baseurl
  - alias: security-token-service-token
    resourceType: restservice
  - alias: dokdistfordeling_channel
    resourceType: channel
    propertyMap:
      name: dokdistfordeling_channel_name
  - alias: mqGateway01
    resourceType: queueManager
  - alias: dokdistfordeling_qdist008_dist_forsendels
    resourceType: queue
  - alias: dokdistfordeling_qdist008_funk_feil
    resourceType: queue
  - alias: dokdistsentralprint_qdist009_dist_s_print
    resourceType: queue
  - alias: dokdistdittnav_qdist010_dist_ditt_nav
    resourceType: queue
  - alias: dokdisteformidling_qdist011_dist_til_dpi
    resourceType: queue
  - alias: dokdistfordeling_qdist012_hent_dok_joark
    resourceType: queue
  - alias: dokdistfordeling_qdist012_funk_feil
    resourceType: queue
  - alias: dokdisteformidling_qdist013_dist_trygderetten
    resourceType: queue




